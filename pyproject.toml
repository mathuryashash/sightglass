[project]
name = "agentwarden"
version = "0.1.0"
description = "SightGlass: a phone camera + Meta SAM 3.1 as an independent overflow guard for a simulated tank controller; Muse Spark explains incidents (advisory only)"
readme = "README.md"
authors = [{ name = "Yashash Mathur" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "httpx",
    "meta-sam-parser==0.1.0",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "pymodbus==3.16.1",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.12",
    "pytest>=9.1.1",
]
