[project]
name = "agentwarden"
version = "0.1.0"
description = "Firewall for AI computer-use agents shopping on a synthetic store"
readme = "README.md"
authors = [{ name = "Yashash Mathur" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "meta-sam-parser==0.1.0",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
]

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.12",
    "pytest>=9.1.1",
]
